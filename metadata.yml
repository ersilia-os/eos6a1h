Identifier: eos6a1h
Slug: cocograph-small
Status: In progress
Title: CoCoGraph Small-Fragment Inpainting
Description: Given a molecule, grows it by attaching a small chemical fragment 
  (2–5 heavy atoms) at a randomly selected position, using a constrained graph 
  diffusion process that keeps the original structure fixed and guarantees the 
  resulting molecule is 100% chemically valid. Useful for exploring close 
  structural analogues and minor scaffold decorations while preserving a 
  molecules core, such as for lead optimization in drug discovery.
